name: Deploy bycaeL and Design Custom to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare public website files
        run: |
          mkdir -p _site
          cp index.html styles.css app.js _site/
          cp -R assets _site/
          mkdir -p _site/esqa-skintint
          cp esqa-skintint/index.html esqa-skintint/style.css esqa-skintint/script.js _site/esqa-skintint/
          cp -R bycaeL _site/bycaeL
          cp -R bycael _site/bycael
          cp -R byilham _site/byilham
          touch _site/.nojekyll

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
